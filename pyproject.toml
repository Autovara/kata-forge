[project]
name = "kata-forge"
version = "0.1.0"
description = "Scaffolder for Kata subnet plugins (kata-sn<N>)."
requires-python = ">=3.12"
dependencies = []  # pure-stdlib generator

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
kata-forge = "kata_forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kata_forge"]

[tool.ruff]
line-length = 100
